name: send-recent

# يرسل إلى تيلغرام ما نُشر في آخر عددٍ من الساعات، من كلّ مصدرٍ يذكر وقت النشر. لا يغيّر state.json.
on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'عدد الساعات'
        default: '3'
        required: true

permissions:
  contents: read

jobs:
  recent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          pip install -q -r requirements.txt
          python -m playwright install --only-shell chromium
      - name: send
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          YT_CHANNELS: ${{ secrets.YT_CHANNELS }}
          YT_SUBSCRIBER: ${{ secrets.YT_SUBSCRIBER }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          HOURS: ${{ inputs.hours }}
        run: python sitewatch.py --recent "$HOURS"
